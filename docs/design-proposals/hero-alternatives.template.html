<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alesvia — tři nové kompozice úvodu</title><style>
/* FONTS */
*{box-sizing:border-box}body{margin:0;color:#221E22;font-family:Figtree,sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #ECA72C;outline-offset:5px}::selection{background:#ECA72C;color:#0F2C59}h1,h2,p{margin:0}button{min-height:44px}a{text-underline-offset:5px}.board{padding:24px 0}.intro{padding:0 20px 20px;max-width:900px}.intro h1{font-size:28px;letter-spacing:-.025em}.intro p{line-height:1.6;margin-top:8px}.controls{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 20px}.controls button{border:1px solid #b9c4d4;border-radius:8px;background:#F9F9F8;color:#0F2C59;padding:10px 16px;font-weight:600}.controls button[aria-pressed=true]{background:#0F2C59;color:white;border-color:#0F2C59}.screen{background:#F9F9F8;max-width:1440px;margin:auto;container-type:inline-size;border-radius:12px;overflow:hidden}.top{padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{width:144px;height:auto}.top nav{display:flex;gap:24px;align-items:center;font-size:14px}.top a{color:#0F2C59;text-decoration:none}.top a:hover{text-decoration:underline}.contact{border:1px solid #0F2C59;border-radius:8px;padding:12px 16px}.hero{position:relative;isolation:isolate;overflow:hidden}.copy{position:relative;z-index:2}h2{font-weight:700;font-size:clamp(44px,7.6cqw,96px);line-height:1.03;letter-spacing:-.035em;text-wrap:balance}h2 span{color:#0F2C59}.lead{font-family:Literata,Georgia,serif;font-size:clamp(16px,1.7cqw,20px);line-height:1.65;max-width:580px;margin-top:24px}.actions{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:28px}.actions a{font-weight:600;color:inherit;padding:14px 0}.actions .primary{background:#31263E;color:white;border-radius:8px;padding:16px 20px;text-decoration:none;display:inline-flex;align-items:center;gap:20px}.actions svg{width:20px;height:20px;transition:transform .25s ease-out}.actions .primary:hover svg{transform:translateX(3px)}.status{font-size:13px;margin-top:28px}.art{pointer-events:none;position:absolute;z-index:0}.next{display:flex;justify-content:space-between;gap:24px;align-items:center;padding:26px 5%;border-top:1px solid #d8dde5}.next strong{font-size:24px;letter-spacing:-.025em}.next a{color:#0F2C59;white-space:nowrap}.explain{padding:24px 20px;max-width:960px;line-height:1.6}.explain h3{font-size:22px;margin:0 0 8px}.explain p+p{margin-top:10px}.explain b{font-weight:700}.note{font-size:14px;color:#5b5362;margin-top:20px}.motion{margin-left:auto}.panel[hidden]{display:none}
/* A: open framing, central copy, deliberate unoccupied edges. */
.a{background:#0F2C59;padding:28px 5% 0}.a .hero{background:#F9F9F8;border-radius:80px 80px 0 0;min-height:630px;padding:76px 8% 42px;text-align:center}.a .lead{margin-left:auto;margin-right:auto}.a .actions{justify-content:center}.a .art{inset:0;width:100%;height:100%}.a .copy{max-width:850px;margin:auto}.a .status{color:#dce5f3;text-align:center;margin:0;padding:16px}.a h2{font-size:clamp(44px,7.2cqw,90px)}
/* B: a sculptural diagonal composed of flat, precise planes. */
.b .hero{padding:64px 6% 48px;min-height:665px;background:#e8edf4}.b .copy{max-width:760px}.b h2{max-width:720px}.b .lead{max-width:510px}.b .art{height:100%;width:46%;right:-8%;top:0}.b .copy{width:76%}.b .status{color:#3e506a}
/* C: wide type, a horizontal color field as the bridge to content. */
.c .hero{padding:56px 6% 0;min-height:680px}.c h2{max-width:1000px}.c .lead{max-width:630px}.c .horizon{position:relative;height:200px;margin:36px -7% 0;background:#0F2C59;overflow:hidden;border-radius:72px 0 0 0}.c .art{inset:0;width:100%;height:100%}.c .status{position:absolute;bottom:22px;left:7%;z-index:2;color:white;background:#0F2C59;padding:8px 12px;border-radius:8px}.c h2 span{display:block}.c .horizon-label{position:absolute;right:7%;bottom:22px;color:white;font-size:14px;z-index:2}.replay .piece{animation:unfold .95s cubic-bezier(.16,1,.3,1) both;transform-box:fill-box;transform-origin:center}.replay .piece:nth-child(2){animation-delay:90ms}.replay .piece:nth-child(3){animation-delay:160ms}@keyframes unfold{from{transform:translateY(22px) scale(.96)}to{transform:translateY(0) scale(1)}}
@container(max-width:700px){.top nav>a:not(.contact){display:none}.top{padding:18px 5%}.logo{width:124px}.a{padding:16px 16px 0}.a .hero{padding:60px 7% 38px;border-radius:48px 48px 0 0;min-height:590px}.a .art{opacity:.75}.b .hero{padding:44px 6% 190px;min-height:690px}.b .copy{width:100%}.b .art{height:260px;width:80%;top:auto;bottom:-60px;right:-22%;transform:rotate(20deg)}.b h2{max-width:560px}.c .hero{padding-top:36px;min-height:0}.c .horizon{height:160px}.c .horizon-label{display:none}.next{align-items:start;flex-direction:column;gap:12px}.next strong{font-size:22px}.actions{gap:8px 20px}.lead{margin-top:22px}.actions .primary{padding:16px}.status{line-height:1.5}.c h2{font-size:clamp(44px,8.6cqw,60px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}body.reduce *{animation:none!important;transition:none!important}
</style></head><body><main class="board"><div class="intro"><h1>Motto má vlastní prostor.</h1><p>Tři alternativy úvodu. Stejné logo, Figtree + Literata a schválené texty; odlišná kompozice a jeden výrazný vizuální motiv. Návrhy k výběru, nikoli změna živého webu.</p></div><div class="controls" aria-label="Výběr návrhu"><button aria-pressed="true" data-choice="a">A · Otevřený prostor</button><button aria-pressed="false" data-choice="b">B · Vlastní směr</button><button aria-pressed="false" data-choice="c">C · Živý horizont</button><button id="replay">Přehrát pohyb</button><button id="reduce" aria-pressed="false">Omezit pohyb</button></div><div id="variants"></div><div class="explain" id="explain" aria-live="polite"></div></main>
<script>
const logo='LOGO';
const arrow='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const content='<div class="copy"><h2>Lidská autonomie <span>je základ.</span></h2><p class="lead">Technologie mění svět, ve kterém žijeme. Alesvia vzniká pro otázky digitalizace, společnosti a prostoru zůstat sami sebou.</p><div class="actions"><a class="primary" href="https://alesvia.org/cs/kontakt" target="_blank" rel="noopener">Pro instituce a partnery '+arrow+'</a><a href="#projects">Poznat naše směry</a></div></div>';
const a='<svg class="art" viewBox="0 0 1100 680" preserveAspectRatio="none" aria-hidden="true"><path class="piece" d="M0 110V0h160v14H16v96Z" fill="#ECA72C"/><path class="piece" d="M1100 570v110H940v-14h144v-96Z" fill="#ECA72C"/><path d="M30 150v380M1070 150v380" stroke="#ccd6e4" stroke-width="1"/></svg>';
const b='<svg class="art" viewBox="0 0 450 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path class="piece" d="M100 700h350V0H330L100 280Z" fill="#0F2C59"/><path class="piece" d="M175 700h105V210L175 300Z" fill="#7189a9"/><path class="piece" d="M297 700h28V180l-28 28Z" fill="#ECA72C"/><path d="M338 160v540" stroke="#91a4bf"/><path d="M350 0 100 280" stroke="#b6c3d6"/></svg>';
const c='<svg class="art" viewBox="0 0 1200 240" preserveAspectRatio="none" aria-hidden="true"><path class="piece" d="M360 240 590 0h360L720 240Z" fill="#7189a9"/><path class="piece" d="M640 240 870 0h55L695 240Z" fill="#ECA72C"/><path class="piece" d="M760 240 990 0h210v240Z" fill="#31263E"/></svg>';
const descriptions={a:['Otevřený prostor','Nejbližší oblíbenému modrému rámu. Motto i odstavec jsou v jedné ose; velký zaoblený vstup a dva zlaté řezy dávají úvodu vlastní siluetu.','Rám se při přehrání jemně otevře. Klidná, důvěryhodná varianta pro instituce; méně výrazná než B.'],b:['Vlastní směr','Motto vede nahoře vlevo, vysvětlení a akce pokračují pod ním. Pravou část nese velká architektonická geometrie: modrá instituce, zlatý prostor pro vlastní cestu. Jde o doprovodný motiv, logo zůstává původní.','Tři plochy se při přehrání složí v krátkém pohybu. Doporučuji pro výraznější charakter: má největší vizuální energii. Na mobilu se motiv přesune pod obsah.'],c:['Živý horizont','Široká typografie má první slovo. Barevný horizont pod textem vytvoří výrazný přechod k projektům — motiv se může opakovat v záhlavích dalších stránek.','Barevné vrstvy se při přehrání spojí. Nejlépe rozšiřitelný systém pro celý web; méně osobitý samotný úvod než B.']};
function render(k){const hero=k==='a'?'<div class="a"><section class="hero">'+a+content+'</section><p class="status">Registraci ústavu připravujeme.</p></div>':k==='b'?'<div class="b"><section class="hero">'+b+content+'<p class="status">Registraci ústavu připravujeme.</p></section></div>':'<div class="c"><section class="hero">'+content+'<div class="horizon">'+c+'<p class="status">Registraci ústavu připravujeme.</p><span class="horizon-label">Identita · Tempo života · Praxe · Pravidla</span></div></section></div>';document.querySelector('#variants').innerHTML='<div class="screen"><header class="top"><img class="logo" src="'+logo+'" alt="Alesvia"><nav aria-label="Ukázková navigace"><a href="https://alesvia.org/cs/o-nas" target="_blank" rel="noopener">O Alesvii</a><a href="#projects">Naše směry</a><a class="contact" href="https://alesvia.org/cs/kontakt" target="_blank" rel="noopener">Spojme se</a></nav></header>'+hero+'<div class="next" id="projects"><strong>Od otázek ke konkrétní práci.</strong><a href="https://www.unplugged.cz" target="_blank" rel="noopener">Unplugged · aktivní projekt</a></div></div>';const d=descriptions[k];document.querySelector('#explain').innerHTML='<h3>'+d[0]+'</h3><p>'+d[1]+'</p><p><b>Pohyb a trade-off:</b> '+d[2]+'</p><p class="note">Pohyb se spouští pouze tlačítkem. Ovládání funguje klávesnicí a respektuje omezení animací. Odkazy na kontakt a Unplugged otevírají současné weby. Toto je srovnání úvodu, nikoli hotová navigace celé homepage.</p>';document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.choice===k)));}
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>render(b.dataset.choice));document.querySelector('#replay').onclick=()=>{const el=document.querySelector('.screen');el.classList.remove('replay');void el.offsetWidth;el.classList.add('replay')};document.querySelector('#reduce').onclick=e=>{const active=document.body.classList.toggle('reduce');e.currentTarget.setAttribute('aria-pressed',String(active))};render('a');
</script></body></html>
